name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Prepare release directory
        run: |
          mkdir release

          node - <<'EOF'
          const fs = require("fs");

          const manifest = JSON.parse(
            fs.readFileSync("module.json", "utf8")
          );

          const version = process.env.VERSION;

          manifest.version = version;

          manifest.esmodules = manifest.esmodules.map(path =>
            path.replace(/^dist\//, "")
          );

          manifest.styles = manifest.styles.map(path =>
            path.replace(/^dist\//, "")
          );

          manifest.download =
            `https://github.com/Dapoulp/daggerheart-card-deck-hud/releases/download/v${version}/daggerheart-card-deck-hud.zip`;

          fs.writeFileSync(
            "release/module.json",
            JSON.stringify(manifest, null, 2) + "\n"
          );
          EOF

          cp -r dist/* release/
          cp -r lang release/
          cp -r templates release/

        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create ZIP
        run: |
          cd release
          zip -r ../daggerheart-card-deck-hud.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            daggerheart-card-deck-hud.zip
            release/module.json
          generate_release_notes: true